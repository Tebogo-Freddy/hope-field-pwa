<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HOPE Compliance Hub - Field PWA</title>
  
  <!-- Connects Luxury Car CSS -->
  <link rel="stylesheet" href="css/luxury-hmi.css">
  
  <style>
    /* Basic layout to preview controls immediately */
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0B0F17;
      color: #F8FAFC;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px;
    }
    .container {
      max-width: 600px;
      width: 100%;
    }
    .status-badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(16, 185, 129, 0.15);
      color: #10B981;
      font-size: 0.85rem;
      margin-bottom: 16px;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="status-badge">● API Gateway Connected</div>
    
    <!-- Sample Thaba Nchu Luxury Facility Card -->
    <div class="facility-card">
      <h2 style="margin: 0 0 6px 0; font-size: 1.25rem;">Ratlou Community Early Learning Centre</h2>
      <p style="margin: 0 0 16px 0; color: #94A3B8; font-size: 0.9rem;">Thaba Nchu Cluster | Mangaung Metro</p>
      
      <div id="telemetryBadge" style="font-size: 0.85rem; color: #06B6D4; margin-bottom: 12px;">
        Acquiring GPS Satellite Signal...
      </div>

      <!-- Action Bar with Custom Controls -->
      <div class="card-action-bar">
        <button class="btn-icon btn-icon--delete" title="Archive / Delete (Silver-Grey)" onclick="alert('Archive facility requested')">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2M10 11v6M14 11v6"/></svg>
        </button>
        <button class="btn-icon btn-icon--edit" title="Edit Profile (Amber)" onclick="alert('Edit profile requested')">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        </button>
        <button class="btn-icon btn-icon--map" title="Map View (Blue)" onclick="alert('Map view requested')">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
        </button>
        <button class="btn-icon btn-icon--street" title="Street View (Cyan)" onclick="alert('Street view requested')">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M16.2 7.8l-2 6.3-6.4 2 2-6.3 6.4-2z"/></svg>
        </button>

        <button id="launchBtn" class="btn-launch-audit" disabled onclick="handleAuditLaunch()">
          <span>Audit Locked (Move Within 50m)</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Connected Scripts -->
  <script src="js/cockpit-flow.js"></script>
  <script src="js/freddy-deterministic.js"></script>

  <script>
    // Live Google Apps Script API Endpoint
    const APPS_SCRIPT_API_URL = "https://script.google.com/macros/s/AKfycbw3dEPvxmNQeev26yoyN-W796FhrProydSC0g9V8giFnXWZsmuLHZkjxG5ilY8HFf30eg/exec";

    // Target coordinates for Ratlou Community Early Learning Centre (Thaba Nchu)
    const TARGET_LAT = -29.2093;
    const TARGET_LNG = 26.8385;

    const launchBtn = document.getElementById('launchBtn');
    const telemetryBadge = document.getElementById('telemetryBadge');

    // Initialize Flow & Freddy
    const cockpit = new CockpitFlowController();
    const freddy = new FreddyAssistantEngine({ mode: 'PHASE_1_DETERMINISTIC', lang: 'en' });

    // Engage 50m Geo-lock
    cockpit.engageHardGeoLock(TARGET_LAT, TARGET_LNG, launchBtn, telemetryBadge);

    function handleAuditLaunch() {
      alert("Hard GPS Geo-Lock Verified! Launching 30-Second Video Sweep...");
    }
  </script>
</body>
</html>
